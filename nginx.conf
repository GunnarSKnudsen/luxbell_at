server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # v2 preview — the rebuilt site, served from the same container so the
    # client can compare both versions on one Cloud Run service:
    #
    #   /      current site  (v1)
    #   /v2/   rebuilt site  (v2, folder ./v2)
    #
    # v2 uses clean URLs, so anything under /v2/ that is not a real file is
    # answered with its index.html and routed client side.
    # ------------------------------------------------------------------
    # v2 works out its own mount point in the browser, so serving it from a
    # subfolder needs no rewriting here — only the SPA fallback.
    location /v2/ {
        try_files $uri $uri/ /v2/index.html;

        # A preview must never be indexed.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(pdf)$ {
        add_header Content-Disposition "inline";
        add_header Cache-Control "public, max-age=86400";
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
}
