# nginx config for the STANDALONE v2 container (Dockerfile + docker-compose.yml
# in this folder). The combined preview that serves v1 at / and v2 at /v2/ from
# a single Cloud Run service uses ../nginx.conf instead — see DEPLOY.md.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # The site loads nothing from third parties, so the policy can be strict.
    #
    # The sha256 below authorises exactly one inline script: the mount-point
    # detection at the top of index.html. Because a hash is present, inline
    # scripts that are NOT that one are still blocked.
    # If you edit that script, update this hash — `node tools/check.mjs`
    # reports the mismatch and prints the new value.
    #
    # NOTE: nginx replaces inherited add_header directives as soon as a nested
    # location declares one of its own. Every cache rule below therefore uses
    # `expires`, which does not reset inheritance, so these four headers apply
    # to every response.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'sha256-F/Ne1tchJKI6zO99x/2r9I0zFERsTeEbCtdIuRM9LZQ='; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Images, PDFs, fonts and the references data. Cached for a week; a changed
    # file name (or a hard refresh) invalidates. PDFs are served as
    # application/pdf and open inline in the browser by default.
    location /assets/ {
        expires 7d;
    }

    # The entry point and the unhashed source files must not be cached, or a
    # redeploy would not reach visitors who have been here before.
    location /src/ {
        expires -1;
    }

    location /styles/ {
        expires -1;
    }

    # Clean URLs: anything that is not a real file is rendered by the app.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
