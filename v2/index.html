<!DOCTYPE html>

<head>
  <!--
    MOUNT POINT DETECTION — must stay the first thing in <head>.

    Every URL in this project (stylesheet, modules, images, PDFs, links) is
    written relative and resolves against <base>. This script works out what
    <base> should be and inserts it before the browser parses anything else,
    so the same files work unchanged at

        /            a normal web root
        /v2/         the preview subfolder
        /anything/   any other subfolder

    with no build step, no server configuration and nothing to edit by hand.

    How: a URL that ends in "/" is a folder, so it is already the mount point.
    A URL that does not is a route (/kontakt, /en/kontakt), so the last
    segment — and a language prefix in front of it — belong to the route and
    not to the mount point.
  -->
  <script>
    (function () {
      var LANGS = ['de', 'en'];
      var path = window.location.pathname;

      // A trailing file name (index.html, 404.html) leaves a folder behind.
      path = path.replace(/[^/]*\.[^/]*$/, '');

      var segments = path.split('/').filter(Boolean);

      // No trailing slash means the last segment is a route slug, not a folder.
      if (!/\/$/.test(path)) segments.pop();
      if (segments.length && LANGS.indexOf(segments[segments.length - 1]) !== -1) segments.pop();

      var base = document.createElement('base');
      base.setAttribute('href', '/' + (segments.length ? segments.join('/') + '/' : ''));
      document.head.appendChild(base);
    })();
  </script>
