# Local preview — no Python, no Node, no build.
#
#   docker compose up      ->  http://localhost:8080
#
# The site is bind-mounted read-only into nginx, so editing a file and
# refreshing the browser is all it takes to see a change.

services:
  site:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./404.html:/usr/share/nginx/html/404.html:ro
      - ./favicon.svg:/usr/share/nginx/html/favicon.svg:ro
      - ./robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ./styles:/usr/share/nginx/html/styles:ro
      - ./src:/usr/share/nginx/html/src:ro
      - ./assets:/usr/share/nginx/html/assets:ro
